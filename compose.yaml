services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            sail:
                aliases:
                    - app
                    - laravel
        depends_on:
            - mysql
            - mailpit
    mysql:
        image: 'mysql:8.4'
        container_name: aifri-mysql
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            sail:
                aliases:
                    - mysql
                    - db
        healthcheck:
            test: "mysqladmin ping -p${DB_PASSWORD}"
            retries: 3
            timeout: 5s
    adminer:
        image: adminer:4
        ports:
            - '${ADMINER_PORT:-8080}:8080'
        environment:
            ADMINER_DEFAULT_SERVER: db
        networks:
            - sail
        depends_on:
            - mysql
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    # Headless Chromium for screenshots; not started by "up", run on demand:
    #   docker compose -p aifri run --rm browser --width=1280,390 / prihlasenie
    # Reaches the app as http://laravel.test on the compose network (no host
    # networking, which behaves differently on Docker Desktop / WSL2).
    browser:
        build:
            context: ./docker/browser
        image: 'aifri/browser'
        profiles: ['tools']
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        shm_size: '1gb'
        environment:
            BASE_URL: 'http://laravel.test'
        volumes:
            - './.screenshots:/shots'
        networks:
            - sail
        depends_on:
            - laravel.test
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
